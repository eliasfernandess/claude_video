<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fredoka;font-weight:600;src:url(fredoka-latin-600-normal.woff2)}
@font-face{font-family:Fredoka;font-weight:700;src:url(fredoka-latin-700-normal.woff2)}
html,body{margin:0;background:#000}
#palco{position:relative;width:1080px;height:1920px;overflow:hidden}
.cena{position:absolute;inset:0;width:1080px;height:1920px;visibility:hidden}
#vinheta{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 60% at 50% 48%,rgba(0,0,0,0) 55%,rgba(20,20,40,.28) 100%)}
#legenda{position:absolute;left:0;right:0;top:1395px;text-align:center}
.bloco{display:none;font-family:Fredoka;font-weight:700;font-size:68px;line-height:1;color:#fff;letter-spacing:.5px;
  -webkit-text-stroke:12px #2a2d3e;paint-order:stroke fill;text-shadow:0 6px 0 rgba(42,45,62,.55)}
.pal.chave.ativa{color:#FFD23F}
</style></head><body>
<div id="palco"><div id="vinheta"></div><div id="legenda"></div></div>
<script src="gsap.min.js"></script><script src="pecas2d.js"></script><script src="cena.js"></script>
<script>document.getElementById('palco').appendChild(document.getElementById('vinheta'));document.getElementById('palco').appendChild(document.getElementById('legenda'));</script>
</body></html>
